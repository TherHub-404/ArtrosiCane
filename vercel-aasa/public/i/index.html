<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artrosi Cane</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin:0; background:#fff; color:#111; }
    main { max-width: 680px; margin: 0 auto; padding: 40px 20px; }
    h1 { margin: 0 0 12px 0; font-size: 28px; }
    p { line-height: 1.5; }
    .box { border:1px solid #eee; border-radius: 12px; padding:16px; background:#fafafa; }
    code { background:#f0f0f0; border-radius:4px; padding:2px 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Artrosi Cane</h1>
    <p>Se hai l'app installata, questo link apre automaticamente l'app.</p>
    <div class="box">
      <p><strong>Parametri link rilevati</strong></p>
      <p id="params">Nessun parametro.</p>
    </div>
  </main>
  <script>
    const qs = new URLSearchParams(window.location.search);
    const t = qs.get('t');
    const location = qs.get('location');
    const parts = [];
    if (t) parts.push('t=' + t);
    if (location) parts.push('location=' + location);
    document.getElementById('params').textContent = parts.length ? parts.join(' | ') : 'Nessun parametro.';
  </script>
</body>
</html>
