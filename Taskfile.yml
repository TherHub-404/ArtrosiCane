version: '3'

tasks:
  run:
    desc: Esegue l'app Flutter su Linux desktop
    cmds:
      - flutter run -d linux

  run-chrome:
    desc: Avvia l'app su Chrome per uno smoke test web rapido (usare device toolbar per iPhone 15)
    cmds:
      - flutter run -d chrome

  run-pixel9-pro:
    desc: Avvia l'app Flutter sull'emulatore Android Pixel 9 Pro
    cmds:
      - flutter emulators --launch Pixel_9_Pro || true
      - |
        ADB_BIN="${ADB:-${ANDROID_SDK_ROOT:+${ANDROID_SDK_ROOT}/platform-tools/adb}}"
        if [ -z "$ADB_BIN" ]; then
          ADB_BIN="${HOME}/Library/Android/sdk/platform-tools/adb"
        fi

        echo "Attendo che l'emulatore Pixel_9_Pro sia pronto..."
        for i in $(seq 1 120); do
          SERIALS="$(flutter devices 2>/dev/null | awk -F '•' '/emulator-[0-9]+/ {gsub(/^ +| +$/, "", $2); print $2}')"
          for SERIAL in $SERIALS; do
            AVD_NAME="$($ADB_BIN -s "$SERIAL" emu avd name 2>/dev/null | head -n 1 | tr -d '\r')"
            if [ "$AVD_NAME" = "Pixel_9_Pro" ]; then
              echo "Uso device $SERIAL ($AVD_NAME)"
              flutter run -d "$SERIAL"
              exit $?
            fi
          done
          sleep 2
        done

        echo "Pixel_9_Pro non trovato. Verifica Android Studio > Device Manager."
        exit 1

  test:
    desc: Esegue la suite di test Flutter
    cmds:
      - flutter test

  analyze:
    desc: Lancia flutter analyze per individuare problemi statici
    cmds:
      - flutter analyze

  clean:
    desc: Pulisce i build artifacts
    cmds:
      - flutter clean

  pub-get:
    desc: Allinea le dipendenze dichiarate in pubspec.yaml
    cmds:
      - flutter pub get
  import-dog-breeds:
    desc: Scarica le razze da TheDogAPI e le importa nella tabella Supabase breeds
    cmds:
      - dart tool/import_dog_breeds.dart

  run-clean:
    desc: Pulisce e rilancia l'app con un ambiente vergine
    cmds:
      - rm -f ~/.config/com.example.artrosi_cane/shared_preferences.json
      - rm -f ~/.config/com.example.artrosi_cane/flutter_shared_preferences.json
      - rm -f ~/.local/share/com.example.artrosi_cane/shared_preferences.json
      - rm -f ~/.local/share/com.example.artrosi_cane/flutter_shared_preferences.json
      - rm -rf build .dart_tool
      - flutter pub get
      - flutter run -d linux --dart-define=RESET_FLOW=true
