name: artrosi_cane
description: App mobile Artrosi Cane con onboarding e quiz
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.1.0
  lottie: ^3.1.2
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  supabase_flutter: ^2.6.0
  flutter_dotenv: ^5.1.0
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env

flutter_icons:
  android: true
  ios: true
  image_path: "assets/App-Icon-iOS.png"
  remove_alpha_ios: true
