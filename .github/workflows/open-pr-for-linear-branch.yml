name: Open PR for Linear branch

on:
  push:
    branches:
      - 'artr-**'
      - 'ARTR-**'
      - '**/artr-**'
      - '**/ARTR-**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    name: Open pull request
    runs-on: ubuntu-latest
    if: github.ref_name != 'main'

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open PR if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TARGET_STATE_NAME: In Review
          TARGET_STATE_ID: 7d2dd602-a828-49c7-b74a-44cea96710c9
        run: |
          set -euo pipefail

          ISSUE_ID="$(printf '%s\n%s\n' "$BRANCH" "$(git log -1 --pretty=%B)" | grep -Eio 'ARTR-[0-9]+' | head -n 1 | tr '[:lower:]' '[:upper:]' || true)"

          if [ -z "$ISSUE_ID" ]; then
            echo "No ARTR issue identifier found in branch name or latest commit message."
            exit 0
          fi

          EXISTING_PR="$(gh pr list \
            --repo "$REPO" \
            --head "$BRANCH" \
            --state open \
            --json number,url \
            --jq '.[0].url // empty')"

          if [ -n "$EXISTING_PR" ]; then
            echo "PR already exists: $EXISTING_PR"
            PR_URL="$EXISTING_PR"
          else
            TITLE="$ISSUE_ID: Codex implementation"
            BODY="$(cat <<EOF
          Linear issue: $ISSUE_ID

          This pull request was opened automatically because branch \`$BRANCH\` was pushed without an open PR.

          Validation:
          - Pending CI
          EOF
          )"

            PR_URL="$(gh pr create \
              --repo "$REPO" \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY")"

            echo "Created PR: $PR_URL"
          fi

          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "LINEAR_API_KEY is not configured; skipping Linear status update."
            exit 0
          fi

          ISSUE_RESPONSE="$(curl -fsS https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg id "$ISSUE_ID" '{query:"query IssueForPr($id: String!) { issue(id: $id) { id identifier state { name } team { states { nodes { id name } } } } }", variables:{id:$id}}')")"

          LINEAR_ISSUE_UUID="$(printf '%s' "$ISSUE_RESPONSE" | jq -r '.data.issue.id // empty')"
          TARGET_STATE_ID="${TARGET_STATE_ID:-$(printf '%s' "$ISSUE_RESPONSE" | jq -r --arg name "$TARGET_STATE_NAME" '.data.issue.team.states.nodes[] | select((.name | ascii_downcase) == ($name | ascii_downcase)) | .id' | head -n 1)}"

          if [ -z "$LINEAR_ISSUE_UUID" ] || [ -z "$TARGET_STATE_ID" ]; then
            echo "Could not resolve Linear issue or target state for $ISSUE_ID."
            exit 0
          fi

          echo "Waiting for Linear's native GitHub automation before setting review state."
          sleep 30

          curl -fsS https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg id "$LINEAR_ISSUE_UUID" --arg stateId "$TARGET_STATE_ID" '{query:"mutation MoveIssue($id: String!, $stateId: String!) { issueUpdate(id: $id, input: { stateId: $stateId }) { success issue { identifier state { name } } } }", variables:{id:$id,stateId:$stateId}}')"

          curl -fsS https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg issueId "$LINEAR_ISSUE_UUID" --arg body "GitHub PR opened and ready for review: $PR_URL" '{query:"mutation Comment($issueId: String!, $body: String!) { commentCreate(input: { issueId: $issueId, body: $body }) { success } }", variables:{issueId:$issueId,body:$body}}')"
