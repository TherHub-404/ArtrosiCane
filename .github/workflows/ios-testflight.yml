name: iOS TestFlight

on:
  push:
    branches:
      - 'codex/artr-*'
      - 'codex/ARTR-*'
      - '**/artr-*'
      - '**/ARTR-*'
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
      - '.metadata'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Create env file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DOG_API_KEY: ${{ secrets.DOG_API_KEY }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          INVITE_API_BASE_URL: ${{ secrets.INVITE_API_BASE_URL }}
          INVITE_DOMAIN: ${{ secrets.INVITE_DOMAIN }}
          INVITE_PATH: ${{ secrets.INVITE_PATH }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL and SUPABASE_ANON_KEY repository secrets are required for TestFlight builds."
            exit 1
          fi

          if [ "$SUPABASE_URL" = "https://your-project.supabase.co" ] || [ "$SUPABASE_ANON_KEY" = "your-anon-key" ]; then
            echo "Refusing to build TestFlight with placeholder Supabase configuration."
            exit 1
          fi

          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "DOG_API_KEY=${DOG_API_KEY:-}"
            echo "SUPABASE_SERVICE_ROLE="
            echo "LIBRETRANSLATE_ENDPOINT="
            echo "LIBRETRANSLATE_API_KEY="
            echo "DEMO_EMAIL="
            echo "DEMO_PASSWORD="
            echo "GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-}"
            echo "GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}"
            echo "INVITE_API_BASE_URL=${INVITE_API_BASE_URL:-https://api.example.com}"
            echo "INVITE_DOMAIN=${INVITE_DOMAIN:-artrosicane.vercel.app}"
            echo "INVITE_PATH=${INVITE_PATH:-/i}"
          } > .env

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install Apple signing assets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_APP_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_APP_BASE64 }}
          IOS_PROVISION_PROFILE_APP_CLIP_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_APP_CLIP_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/ios_distribution.p12"
          APP_PROFILE_PATH="$RUNNER_TEMP/ArtrosiCane_App_Store.mobileprovision"
          APP_CLIP_PROFILE_PATH="$RUNNER_TEMP/ArtrosiCane_App_Clip_App_Store.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISION_PROFILE_APP_BASE64" | base64 -D > "$APP_PROFILE_PATH"
          echo "$IOS_PROVISION_PROFILE_APP_CLIP_BASE64" | base64 -D > "$APP_CLIP_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$APP_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/92cd84c7-cc4c-40b4-bd71-2b8bacb1ca56.mobileprovision"
          cp "$APP_CLIP_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/4e595613-fae5-41cc-8a12-d3a032bde192.mobileprovision"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/appstore"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/appstore/AuthKey.p8"

      - name: Resolve TestFlight version
        id: version
        env:
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/appstore/AuthKey.p8
        run: bundle exec fastlane ios resolve_testflight_version

      - name: Build IPA
        run: |
          set -euo pipefail
          BUILD_NAME="${{ steps.version.outputs.build_name }}"
          BUILD_NUMBER="${{ steps.version.outputs.build_number }}"
          echo "Using iOS build number: $BUILD_NUMBER"
          echo "Using iOS build name: $BUILD_NAME"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $BUILD_NAME" ios/AppClip/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/AppClip/Info.plist

          flutter build ipa \
            --release \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/appstore/AuthKey.p8
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found in build/ios/ipa"
            exit 1
          fi
          export IPA_PATH
          bundle exec fastlane ios upload_testflight
